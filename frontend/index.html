<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b91c1c" />

    <!-- Manifest: /m/ dùng bản mobile, còn lại dùng bản desktop -->
    <link id="app-manifest" rel="manifest" href="/manifest.webmanifest" />
    <script>
      if (!location.pathname.startsWith('/m')) {
        document.getElementById('app-manifest').setAttribute('href', '/manifest-desktop.webmanifest');
      }
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vướng mắc" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Operations Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-wood-50 text-slate-800 antialiased h-screen overflow-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
